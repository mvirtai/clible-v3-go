<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 290" width="100%" height="100%">
  <defs>
    <!-- Background linear gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Card headers linear gradients -->
    <linearGradient id="trigger-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="object-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="methods-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="output-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.05" />
    </linearGradient>

    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <style>
    .window-title { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 600; fill: #64748b; letter-spacing: 0.08em; text-transform: uppercase; }
    .code-text { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace; font-size: 17px; font-weight: 600; }
    .card-label { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
    .card-title { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #f8fafc; }
    .card-sub { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #94a3b8; }
    .card-desc { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #64748b; line-height: 1.4; }
  </style>

  <!-- Outer container card -->
  <rect x="2" y="2" width="816" height="286" rx="16" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="1.5" filter="url(#card-shadow)" />

  <!-- Window chrome header -->
  <g transform="translate(18, 16)">
    <circle cx="0" cy="0" r="4.5" fill="#ef4444" />
    <circle cx="14" cy="0" r="4.5" fill="#f59e0b" />
    <circle cx="28" cy="0" r="4.5" fill="#10b981" />
    <text x="50" y="3.5" class="window-title">ISLA v2 Expression Anatomy</text>
  </g>

  <!-- Code Block Bar -->
  <g transform="translate(20, 42)">
    <rect x="0" y="0" width="780" height="52" rx="10" fill="#030712" stroke="#1e293b" stroke-width="1.2" />

    <!-- Trigger token chip -->
    <rect x="14" y="9" width="32" height="34" rx="6" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1" />
    <text x="24" y="32" class="code-text" fill="#f59e0b">!</text>

    <!-- Object token chip -->
    <rect x="54" y="9" width="168" height="34" rx="6" fill="#a855f7" fill-opacity="0.12" stroke="#a855f7" stroke-opacity="0.3" stroke-width="1" />
    <text x="66" y="32" class="code-text" fill="#c084fc">@(Joh 3:16)</text>

    <!-- Methods token chip -->
    <rect x="230" y="9" width="232" height="34" rx="6" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1" />
    <text x="242" y="32" class="code-text" fill="#38bdf8">.vs(KR92, KJV)</text>

    <!-- Output token chip -->
    <rect x="470" y="9" width="296" height="34" rx="6" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.3" stroke-width="1" />
    <text x="482" y="32" class="code-text" fill="#34d399">=&gt; #joh-study</text>
  </g>

  <!-- Connecting Lines / Indicators -->
  <!-- Line 1: Trigger (center 30 -> card center 113) -->
  <path d="M 30 94 L 30 112 Q 30 122 45 122 L 98 122 Q 113 122 113 134" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,3" />
  <!-- Line 2: Object (center 138 -> card center 311) -->
  <path d="M 138 94 L 138 112 Q 138 122 153 122 L 296 122 Q 311 122 311 134" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="3,3" />
  <!-- Line 3: Methods (center 346 -> card center 509) -->
  <path d="M 346 94 L 346 112 Q 346 122 361 122 L 494 122 Q 509 122 509 134" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3" />
  <!-- Line 4: Output (center 618 -> card center 707) -->
  <path d="M 618 94 L 618 112 Q 618 122 633 122 L 692 122 Q 707 122 707 134" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="3,3" />


  <!-- 4 Component Cards Grid -->
  <!-- Card 1: Trigger -->
  <g transform="translate(20, 134)">
    <rect x="0" y="0" width="186" height="136" rx="10" fill="url(#trigger-glow)" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1.2" />
    <text x="14" y="24" class="card-label" fill="#f59e0b">0. Trigger</text>
    <text x="14" y="44" class="card-title">Execution Prefix</text>
    <text x="14" y="66" class="card-sub">! or !isla</text>
    <line x1="14" y1="78" x2="172" y2="78" stroke="#f59e0b" stroke-opacity="0.2" stroke-width="1" />
    <text x="14" y="96" class="card-desc">Signals notebook notes</text>
    <text x="14" y="112" class="card-desc">to execute expression.</text>
    <text x="14" y="128" class="card-desc" fill="#94a3b8">Optional in API/CLI.</text>
  </g>

  <!-- Card 2: Object -->
  <g transform="translate(218, 134)">
    <rect x="0" y="0" width="186" height="136" rx="10" fill="url(#object-glow)" stroke="#a855f7" stroke-opacity="0.3" stroke-width="1.2" />
    <text x="14" y="24" class="card-label" fill="#c084fc">1. Object</text>
    <text x="14" y="44" class="card-title">Source Data Query</text>
    <text x="14" y="66" class="card-sub">@(), range, search, ^</text>
    <line x1="14" y1="78" x2="172" y2="78" stroke="#a855f7" stroke-opacity="0.2" stroke-width="1" />
    <text x="14" y="96" class="card-desc">Defines WHAT data is</text>
    <text x="14" y="112" class="card-desc">queried from database</text>
    <text x="14" y="128" class="card-desc" fill="#e9d5ff">Required: 1 object.</text>
  </g>

  <!-- Card 3: Methods -->
  <g transform="translate(416, 134)">
    <rect x="0" y="0" width="186" height="136" rx="10" fill="url(#methods-glow)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.2" />
    <text x="14" y="24" class="card-label" fill="#38bdf8">2. Method(s)</text>
    <text x="14" y="44" class="card-title">Transform &amp; Analyze</text>
    <text x="14" y="66" class="card-sub">.use .vs .themes .stats</text>
    <line x1="14" y1="78" x2="172" y2="78" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1" />
    <text x="14" y="96" class="card-desc">Chained left-to-right</text>
    <text x="14" y="112" class="card-desc">to filter, compare, or</text>
    <text x="14" y="128" class="card-desc" fill="#bae6fd">calculate statistics.</text>
  </g>

  <!-- Card 4: Output -->
  <g transform="translate(614, 134)">
    <rect x="0" y="0" width="186" height="136" rx="10" fill="url(#output-glow)" stroke="#34d399" stroke-opacity="0.3" stroke-width="1.2" />
    <text x="14" y="24" class="card-label" fill="#34d399">3. Output</text>
    <text x="14" y="44" class="card-title">Destination &amp; State</text>
    <text x="14" y="66" class="card-sub">=&gt; | &gt; | &gt;&gt; #slug</text>
    <line x1="14" y1="78" x2="172" y2="78" stroke="#34d399" stroke-opacity="0.2" stroke-width="1" />
    <text x="14" y="96" class="card-desc">Inline (=&gt;), above (&gt;),</text>
    <text x="14" y="112" class="card-desc">or new cell below (&gt;&gt;).</text>
    <text x="14" y="128" class="card-desc" fill="#a7f3d0">Optional: binds #slug.</text>
  </g>
</svg>
