version: "3"

dotenv:
  - ".env"

tasks:
  default:
    desc: List all available tasks
    cmds:
      - task --list

  # --- Backend (Go) Tasks --- #
  backend:tidy:
    desc: Tidy and verify Go module dependencies
    dir: backend
    cmds:
      - go mod tidy
      - go mod verify

  backend:format:
    desc: Auto-format Go source code files
    dir: backend
    cmds:
      - go fmt ./...

  backend:lint:
    desc: Run golangci-lint on the Go source code
    dir: backend
    cmds:
      - golangci-lint run ./...

  backend:test:
    desc: Run all Go unit and integration tests
    dir: backend
    cmds:
      - go test -v ./...

  backend:test-cov:
    desc: Run all Go unit and integration tests with race detector
    dir: backend
    cmds:
      - mkdir -p ../.cov/backend
      - go test -v -race -coverprofile=../.cov/backend/coverage.out ./internal/...
      - go tool cover -func=../.cov/backend/coverage.out | tee ../.cov/backend/coverage.txt

  backend:test-pkg:
    desc: "Run tests for a specific package and produce coverage report. Usage: task backend:test-pkg PKG=middleware"
    dir: backend
    vars:
      PKG: '{{default "" .PKG}}'
    preconditions:
      - sh: 'test -n "{{.PKG}}"'
        msg: "Missing PKG argument. Usage: task backend:test-pkg PKG=middleware"
    cmds:
      - mkdir -p ../.cov/backend
      - go test -v -race -coverprofile=../.cov/backend/{{.PKG}}.out ./internal/{{.PKG}}/...
      - go tool cover -func=../.cov/backend/{{.PKG}}.out | tee ../.cov/backend/{{.PKG}}.txt


  backend:build:
    desc: Build the Go HTTP API production binary
    dir: backend
    cmds:
      - go build -v -o bin/server main.go

  backend:run:
    desc: Run the Go HTTP API development bin/server
    dir: backend
    cmds:
      - go run main.go

  backend:dev:
    desc: Run the Go web-native REST API in watch/live mode
    dir: backend
    cmds:
      - go run main.go

  # --- Frontend (React) Tasks ---
  frontend:install:
    desc: Install frontend dependencies using pnpm
    dir: frontend
    cmds:
      - pnpm install

  frontend:lint:
    desc: Run linter and type-checks for the React application
    dir: frontend
    cmds:
      - pnpm run lint

  frontend:build:
    desc: Build the production frontend assets
    dir: frontend
    cmds:
      - pnpm run build

  frontend:test:
    desc: Run frontend unit tests
    dir: frontend
    cmds:
      - pnpm run test -- --reporter=verbose

  frontend:test-cov:
    desc: Run frontend unit tests and produce coverage report
    dir: frontend
    cmds:
      - pnpm run test -- --coverage --reporter=verbose

  frontend:test-ui:
    desc: Run frontend unit tests with Vitest UI
    dir: frontend
    cmds:
      - pnpm run test -- --coverage --reporter=html


  frontend:dev:
    desc: Run the React+Vite frontend development bin/server
    dir: frontend
    cmds:
      - pnpm run dev

  # --- Global Development --- #

  dev:
    desc: Boot up both systems concurrently for fullstack workspace development
    deps:
      - task: backend:dev
      - task: frontend:dev

  # --- Global Quality Gates --- #
  check:
    desc: Run all backend and frontend quality checks concurrently (lint and test)
    deps:
      - task: backend:check
      - task: frontend:check
    cmds:
      - echo "All local quality checks passed flawlessly!"

  backend:check:
    desc: Run all backend quality checks (tidy, lint, and test-cov)
    dir: backend
    cmds:
      - task: backend:tidy
      - task: backend:lint
      - task: backend:test-cov

  frontend:check:
    desc: Run all frontend quality checks (lint and test-cov)
    dir: frontend
    cmds:
      - task: frontend:lint
      - task: frontend:test-cov


  # --- Git --- #
  # --- Git & GitHub Automation ---
  # --- Git & GitHub Automation ---
  git:pr:
    desc: Create a GitHub PR using a permanent PR story file from ./pr_stories/
    vars:
      CURRENT_BRANCH:
        sh: git branch --show-current
      TITLE:
        sh: |
          if [ -n "{{.TITLE}}" ]; then
            echo "{{.TITLE}}"
          elif [ -n "{{.FILE}}" ]; then
            echo "{{.FILE}}" | sed -E -e 's/\.md$//' -e 's/^[0-9]+-//' -e 's/^([a-z]+)-/\1: /' -e 's/-/ /g'
          else
            git branch --show-current
          fi
      # Automatically targets the pr_stories directory
      STORY_PATH: "pr_stories/{{.FILE}}"
    preconditions:
      - sh: command -v gh >/dev/null 2>&1
        msg: "GitHub CLI (gh) is required but not installed. Run 'brew install gh' or equivalent."
      - sh: 'test -n "{{.FILE}}"'
        msg: "Missing FILE argument. Usage: task git:pr FILE=your-story.md"
      - sh: 'test -f "{{.STORY_PATH}}"'
        msg: "The file '{{.STORY_PATH}}' does not exist. Ensure it is placed in the ./pr_stories/ directory."
    cmds:
      - task: check
      - echo "Staging a temporary deployment copy of {{.STORY_PATH}}..."
      - cp "{{.STORY_PATH}}" temp_pr_story.md
      - echo "Pushing branch {{.CURRENT_BRANCH}} to origin..."
      - git push origin {{.CURRENT_BRANCH}}
      - echo "Creating pull request via GitHub API..."
      - gh pr create --title "{{.TITLE}}" --body-file temp_pr_story.md
      - echo "PR created successfully! Cleaning up intermediate assets..."
      - rm temp_pr_story.md

  git:commit:
    desc: 'Stage changes and create a formatted conventional commit. Usage: task commit TYPE=feat SCOPE=setup MSG="add config loader" [FILES="file1 file2"]'
    cmds:
      - |
        VALID_TYPES="feat fix docs style refactor perf test build ci chore"
        TYPE="{{.TYPE}}"
        SCOPE="{{.SCOPE}}"
        MSG="{{.MSG}}"
        FILES="{{.FILES}}"

        if [ -z "$FILES" ]; then
          FILES="."
        fi

        if [ -z "$TYPE" ] || [ -z "$SCOPE" ] || [ -z "$MSG" ]; then
          echo "ERROR: Parameters TYPE, SCOPE, and MSG are required!"
          echo "Usage: task commit TYPE=feat SCOPE=setup MSG=\"add configuration loader\" [FILES=\"cmd/ internal/config/config.go\"]"
          echo "Allowed TYPE values: $VALID_TYPES"
          echo "Example SCOPE values: setup, config, handler, server, test, docs, db, auth"
          exit 1
        fi

        IS_VALID=0
        for t in $VALID_TYPES; do
          if [ "$t" = "$TYPE" ]; then
            IS_VALID=1
            break
          fi
        done

        if [ $IS_VALID -eq 0 ]; then
          echo "ERROR: Invalid commit type '$TYPE'."
          echo "Allowed TYPE values are: $VALID_TYPES"
          exit 1
        fi

        FULL_MSG="${TYPE}(${SCOPE}): ${MSG}"

        echo "[TASK] Formatted commit message: '$FULL_MSG'"
        echo "[TASK] Staging files: '$FILES'"
        task check
        git add $FILES
        git commit -m "$FULL_MSG"
        echo "[TASK] Conventional commit created successfully: '$FULL_MSG'"


  git:post-merge-branch:
    desc: Force-switch to main, hard-reset to origin/main, and delete the topic branch after PR merge
    cmds:
      - |
        CURRENT_BRANCH=$(git branch --show-current)
        if [ "$CURRENT_BRANCH" = "main" ] || [ "$CURRENT_BRANCH" = "master" ]; then
          echo "Error: You are already on $CURRENT_BRANCH. Run this command from your topic branch before switching."
          exit 1
        fi
        echo "Starting post-merge cleanup for branch: $CURRENT_BRANCH"
        git switch -f main
        git fetch --all
        git reset --hard origin/main
        git branch -D "$CURRENT_BRANCH"
        git clean -fd
        echo "Post-merge cleanup completed successfully!"


  git:merge:
    desc: Squash and merge the current branch's PR on GitHub and delete the branch
    preconditions:
      - sh: command -v gh >/dev/null 2>&1
        msg: "GitHub CLI (gh) is required but not installed."
    cmds:
      - gh pr merge --squash --delete-branch

  git:status:
    desc: Check the status and checks of the current PR on GitHub
    preconditions:
      - sh: command -v gh >/dev/null 2>&1
        msg: "GitHub CLI (gh) is required but not installed."
    cmds:
      - gh pr status
      - gh pr checks

  git:diff:
    desc: Show diff of the current branch against main branch
    cmds:
      - git diff origin/main...HEAD

  git:sync-after-merge:
    desc: Fetch latest main and merge it into the current branch
    cmds:
      - git fetch --all
      - git reset --hard origin/main

  git:stage-commit-push:
    desc: "Stage, commit and push the current branch to origin. USAGE: task git:stage-commit-push MESSAGE='feat: add new feature'"
    vars:
      FORCE: '{{.FORCE | default "false"}}'
    preconditions:
      - sh: 'test -n "{{.MESSAGE}}"'
        msg: "Missing MESSAGE argument. Usage: task git:stage-commit-push MESSAGE='feat: add new feature'"
    cmds:
      - git add .
      - git commit -m "{{.MESSAGE}}"
      - if [ "{{.FORCE}}" = "true" ]; then git push -u origin HEAD --force-with-lease; else git push -u origin HEAD; fi

  git:new-branch:
    desc: "Create a new branch from main. USAGE: task git:new-branch FEAT_TYPE=feat/fix/ci/docs/refactor/chore/test/perf BRANCH_NAME=new-feature"
    vars:
      BRANCH_NAME: '{{.BRANCH_NAME}}'
      FEAT_TYPE: '{{.FEAT_TYPE | default "feat"}}'
    preconditions:
      - sh: 'test -n "{{.BRANCH_NAME}}"'
        msg: "Missing BRANCH_NAME argument. Usage: task git:new-branch BRANCH_NAME=new-feature"
      - sh: 'case "{{.FEAT_TYPE}}" in feat|fix|ci|ui|docs|refactor|chore|test|perf) true;; *) false;; esac'
        msg: "Invalid FEAT_TYPE. Must be one of: feat, fix, ci, ui, docs, refactor, chore, test, perf. Usage: task git:new-branch FEAT_TYPE=feat BRANCH_NAME=new-feature"
    cmds:
      - git switch -c "{{.FEAT_TYPE}}/{{.BRANCH_NAME}}"

  git:commit-all:
    desc: "Execute all staged commits defined in .git-commits.sh and clean up on success"
    preconditions:
      - sh: 'test -f .git-commits.sh'
        msg: "No .git-commits.sh file found. Please create one with git commands first."
    cmds:
      - bash .git-commits.sh && rm .git-commits.sh

  # --- Docker Tasks --- #
  docker:build:
    desc: Build the unified production Docker image using BuildKit
    cmds:
      - docker build -t clible-v3 .

  docker:run:
    desc: Run the unified production Docker image locally
    cmds:
      - echo "Starting Clible-v3 container on http://localhost:8080"
      - docker run -p 8080:8080 --name clible-v3-app --env-file .env --rm clible-v3

  docker:tag:
    desc: "Tag the local clible-v3 image for DockerHub. USAGE: task docker:tag TAG=latest"
    vars:
      REGISTRY: '{{.REGISTRY | default "mvirtai"}}'
      IMAGE_NAME: '{{.IMAGE_NAME | default "clible-v3"}}'
      TAG: '{{.TAG | default "latest"}}'
    cmds:
      - docker tag clible-v3 {{.REGISTRY}}/{{.IMAGE_NAME}}:{{.TAG}}
      - echo "Tagged clible-v3 as {{.REGISTRY}}/{{.IMAGE_NAME}}:{{.TAG}}"

  docker:push:
    desc: "Tag and push the clible-v3 image to DockerHub. USAGE: task docker:push TAG=latest"
    vars:
      REGISTRY: '{{.REGISTRY | default "mvirtai"}}'
      IMAGE_NAME: '{{.IMAGE_NAME | default "clible-v3"}}'
      COMMIT:
       - sh: git rev-parse --short HEAD
      TAG: '{{.COMMIT | default "latest"}}'
    preconditions:
      - sh: 'test -n "{{.COMMIT}}"'
        msg: "Missing COMMIT argument. Usage: task docker:push COMMIT=<commit-hash>"
    cmds:
      - task: docker:tag
      - cmd: echo "Pushing {{.REGISTRY}}/{{.IMAGE_NAME}}:{{.TAG}} to DockerHub [1/2]"
        vars: { REGISTRY: "{{.REGISTRY}}", IMAGE_NAME: "{{.IMAGE_NAME}}", TAG: "{{.TAG}}" }
      - docker push {{.REGISTRY}}/{{.IMAGE_NAME}}:{{.TAG}}
      - cmd: echo "Pushing {{.REGISTRY}}/{{.IMAGE_NAME}}:latest to DockerHub [2/2]"
        vars: { REGISTRY: "{{.REGISTRY}}", IMAGE_NAME: "{{.IMAGE_NAME}}", TAG: "{{.TAG}}" }
      - docker push {{.REGISTRY}}/{{.IMAGE_NAME}}:latest

  docker:push-gcr:
    desc: "Build and push to Google Container Registry. Usage: task docker:push-gcr PROJECT_ID=your-project-id"
    vars:
      PROJECT_ID: '{{.PROJECT_ID}}'
      COMMIT:
        sh: git rev-parse --short HEAD
      IMAGE: "gcr.io/{{.PROJECT_ID}}/clible-v3"
    preconditions:
      - sh: 'test -n "{{.PROJECT_ID}}"'
        msg: "Missing PROJECT_ID. Usage: task docker:push-gcr PROJECT_ID=your-project-id"
    cmds:
      - task: docker:build
      - docker tag clible-v3 {{.IMAGE}}:{{.COMMIT}}
      - docker tag clible-v3 {{.IMAGE}}:latest
      - docker push {{.IMAGE}}:{{.COMMIT}}
      - docker push {{.IMAGE}}:latest
      - echo "✅ Pushed {{.IMAGE}}:latest (commit {{.COMMIT}})"

  deploy:gcr:
    desc: "Deploy to Cloud Run from GCR. Usage: task deploy:gcr PROJECT_ID=your-project-id"
    vars:
      PROJECT_ID: '{{.PROJECT_ID}}'
      IMAGE: "gcr.io/{{.PROJECT_ID}}/clible-v3:latest"
    preconditions:
      - sh: 'test -n "{{.PROJECT_ID}}"'
        msg: "Missing PROJECT_ID. Usage: task deploy:gcr PROJECT_ID=your-project-id"
    cmds:
      - task: docker:push-gcr
        vars: { PROJECT_ID: "{{.PROJECT_ID}}" }
      - gcloud run deploy clible-v3 \
          --image {{.IMAGE}} \
          --region europe-north1 \
          --project {{.PROJECT_ID}} \
          --allow-unauthenticated \
          --set-env-vars "PORT=8080,ENV=production,DATABASE_URL={{.DATABASE_URL}},JWT_SECRET={{.JWT_SECRET}},GEMINI_API_KEY={{.GEMINI_API_KEY}}"
      - echo "✅ Deployed to Cloud Run!"
